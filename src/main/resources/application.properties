# Puerto donde corre la API: http://localhost:8080
server.port=8080

# Nombre que aparece en los logs al arrancar
spring.application.name=mini-catalogo-api

# ------------------------------------------------------------------
# OPCIÓN: usar MySQL en vez de memoria (NO activa por defecto)
# ------------------------------------------------------------------
# Hoy la API guarda todo en memoria y corre sin base de datos.
# Para pasarla a MySQL habría que:
#   1. Agregar al pom.xml la dependencia spring-boot-starter-data-jpa
#      y el conector mysql-connector-j.
#   2. Cambiar el controlador para usar un repositorio JPA en vez
#      del mapa en memoria.
#   3. Descomentar estas líneas y poner TUS datos (nunca subir
#      usuario/contraseña reales a GitHub; usar variables de entorno):
#
# spring.datasource.url=jdbc:mysql://localhost:3306/catalogo
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=update
